name: Build and publish Android APK

on:
  push:
    branches: [main]
    paths:
      - 'tuklas_mobile/**'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Check release configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for value in "$PUBLIC_APP_URL" "$DEPLOY_HOST" "$DEPLOY_USER" "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$ANDROID_STORE_PASSWORD" "$DEPLOY_SSH_KEY" "$DEPLOY_KNOWN_HOSTS"; do
            test -n "$value" || { echo 'Missing mobile release configuration'; exit 1; }
          done
          [[ "$PUBLIC_APP_URL" == https://* ]] || { echo 'PUBLIC_APP_URL must use HTTPS'; exit 1; }
          curl --fail --silent --show-error --max-time 15 "${PUBLIC_APP_URL%/}/api/mobile/tesda" >/dev/null || { echo 'PUBLIC_APP_URL must reach Tuklas over HTTPS with a valid certificate'; exit 1; }
          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Prepare signing and SSH
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > tuklas_mobile/android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > tuklas_mobile/android/key.properties
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Build APK
        working-directory: tuklas_mobile
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          flutter test
          api_base="${PUBLIC_APP_URL%/}/api/mobile"
          flutter build apk --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER" --dart-define="API_BASE=$api_base"
      - uses: actions/upload-artifact@v4
        with:
          name: tuklas-mobile-${{ env.BUILD_NUMBER }}
          path: tuklas_mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          apk_name="tuklas-mobile-$BUILD_NUMBER.apk"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          scp -o StrictHostKeyChecking=yes tuklas_mobile/build/app/outputs/flutter-apk/app-release.apk "$remote:/tmp/$apk_name"
          ssh -o StrictHostKeyChecking=yes "$remote" "sudo install -d -m 755 /var/www/tuklas/public/app-updates && sudo install -m 644 /tmp/$apk_name /var/www/tuklas/public/app-updates/$apk_name && rm /tmp/$apk_name"
          python3 -c 'import json,os; from pathlib import Path; from urllib.parse import urlparse; url=os.environ["PUBLIC_APP_URL"].rstrip("/"); assert urlparse(url).scheme=="https"; notes=Path("tuklas_mobile/PATCH_NOTES.md").read_text().strip(); json.dump({"version_code":int(os.environ["BUILD_NUMBER"]),"version_name":os.environ["VERSION_NAME"],"apk_url":url+"/app-updates/tuklas-mobile-"+os.environ["BUILD_NUMBER"]+".apk","patch_notes":notes},open("latest.json","w"))'
          scp -o StrictHostKeyChecking=yes latest.json "$remote:/tmp/tuklas-update-$GITHUB_RUN_ID.json"
          ssh -o StrictHostKeyChecking=yes "$remote" "sudo install -m 644 /tmp/tuklas-update-$GITHUB_RUN_ID.json /var/www/tuklas/public/app-updates/latest-$GITHUB_RUN_ID.json && sudo mv /var/www/tuklas/public/app-updates/latest-$GITHUB_RUN_ID.json /var/www/tuklas/public/app-updates/latest.json && rm /tmp/tuklas-update-$GITHUB_RUN_ID.json"
