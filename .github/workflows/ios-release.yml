name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed IPA to App Store Connect for TestFlight
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    env:
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate release configuration and install signing files
        shell: bash
        run: |
          set -euo pipefail
          for value in "$PUBLIC_APP_URL" "$IOS_TEAM_ID" "$IOS_CERTIFICATE_BASE64" "$IOS_CERTIFICATE_PASSWORD" "$IOS_PROVISIONING_PROFILE_BASE64" "$KEYCHAIN_PASSWORD"; do
            test -n "$value" || { echo 'Missing iOS release configuration in GitHub Actions secrets or variables'; exit 1; }
          done
          [[ "$PUBLIC_APP_URL" == https://* ]] || { echo 'PUBLIC_APP_URL must use HTTPS'; exit 1; }
          [[ "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo 'IOS_TEAM_ID must be the 10-character Apple Developer Team ID'; exit 1; }

          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

          keychain_path="$RUNNER_TEMP/tuklas-build.keychain-db"
          certificate_path="$RUNNER_TEMP/ios_distribution.p12"
          profile_path="$RUNNER_TEMP/tuklas.mobileprovision"
          profile_plist="$RUNNER_TEMP/tuklas-profile.plist"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")
          profile_bundle=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist" | sed "s/^$profile_team\.//")
          [[ "$profile_team" == "$IOS_TEAM_ID" ]] || { echo 'Provisioning profile team does not match IOS_TEAM_ID'; exit 1; }
          [[ "$profile_bundle" == 'com.tuklas.ios' ]] || { echo 'Provisioning profile must target com.tuklas.ios'; exit 1; }
          [[ "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]] || { echo 'Provisioning profile UUID is invalid'; exit 1; }
          [[ "$profile_name" != *$'\n'* ]] || { echo 'Provisioning profile name contains an unsupported newline'; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Configure Xcode distribution signing
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path('tuklas_mobile/ios/Runner.xcodeproj/project.pbxproj')
          source = project.read_text()
          section_start = source.index('/* Begin XCBuildConfiguration section */')
          section_end = source.index('/* End XCBuildConfiguration section */', section_start)
          section = source[section_start:section_end]
          blocks = []
          cursor = 0

          while True:
              start = section.find('= {', cursor)
              if start < 0:
                  break
              brace_start = section.find('{', start)
              depth = 0
              quoted = False
              escaped = False
              end = brace_start
              while end < len(section):
                  character = section[end]
                  if quoted:
                      if escaped:
                          escaped = False
                      elif character == '\\':
                          escaped = True
                      elif character == '"':
                          quoted = False
                  elif character == '"':
                      quoted = True
                  elif character == '{':
                      depth += 1
                  elif character == '}':
                      depth -= 1
                      if depth == 0:
                          end += 1
                          break
                  end += 1
              blocks.append((start, end, section[start:end]))
              cursor = end

          replacements = []
          for start, end, block in blocks:
              if ('PRODUCT_BUNDLE_IDENTIFIER = com.tuklas.ios;' not in block
                      or 'name = Release;' not in block and 'name = Profile;' not in block):
                  continue
              insertion = (
                  f'\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
                  f'\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
                  f'\t\t\t\tDEVELOPMENT_TEAM = {os.environ["IOS_TEAM_ID"]};\n'
                  f'\t\t\t\tPROVISIONING_PROFILE = {os.environ["IOS_PROFILE_UUID"]};\n'
              )
              build_settings = block.find('buildSettings = {')
              if build_settings < 0:
                  raise SystemExit('Runner build settings block was not found')
              insertion_point = start + build_settings + len('buildSettings = {')
              replacements.append((insertion_point, insertion))

          if len(replacements) != 2:
              raise SystemExit(f'Expected Release and Profile Runner settings, found {len(replacements)}')
          for position, insertion in reversed(replacements):
              section = section[:position] + '\n' + insertion + section[position:]
          project.write_text(source[:section_start] + section + source[section_end:])
          PY

      - name: Build App Store IPA
        working-directory: tuklas_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              'method': 'app-store',
              'teamID': os.environ['IOS_TEAM_ID'],
              'signingStyle': 'manual',
              'provisioningProfiles': {'com.tuklas.ios': os.environ['IOS_PROFILE_NAME']},
              'destination': 'export',
              'stripSwiftSymbols': True,
          }
          Path('ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          flutter build ipa --release \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --export-options-plist=ExportOptions.plist \
            --dart-define="API_BASE=$PUBLIC_APP_URL/api/mobile"

      - uses: actions/upload-artifact@v4
        with:
          name: tuklas-ios-${{ env.BUILD_NUMBER }}
          path: tuklas_mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for value in "$APP_STORE_CONNECT_API_KEY_ID" "$APP_STORE_CONNECT_ISSUER_ID" "$APP_STORE_CONNECT_API_KEY_BASE64"; do
            test -n "$value" || { echo 'TestFlight upload requested but App Store Connect API key secrets are missing'; exit 1; }
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file tuklas_mobile/build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/tuklas-build.keychain-db" 2>/dev/null || true
